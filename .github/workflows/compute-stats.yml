name: Compute Market Stats

on:
  # Run on the 1st of each month at 8am UTC (after weekly scrape has completed)
  schedule:
    - cron: '0 8 1 * *'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      month:
        description: 'Specific month to compute (e.g., 2026-03). Default: previous month'
        required: false
        type: string
      quarter:
        description: 'Specific quarter to compute (e.g., 2026-Q1). Default: auto-detect'
        required: false
        type: string

jobs:
  compute:
    name: Compute Monthly Market Statistics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Run market stats computation
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.month }}" ]; then
            ARGS="$ARGS --month ${{ inputs.month }}"
          fi
          if [ -n "${{ inputs.quarter }}" ]; then
            ARGS="$ARGS --quarter ${{ inputs.quarter }}"
          fi
          echo "📊 Computing market statistics..."
          npx tsx scripts/compute-market-stats.ts $ARGS

      - name: Report completion
        if: always()
        run: |
          echo "=============================================="
          echo "📊 Market stats computation complete"
          echo "   Status: ${{ job.status }}"
          echo "   Next run: 1st of next month"
          echo "=============================================="
