name: RE/MAX Full Scrape

# Manual: re-check every RE/MAX listing we hold (2 s between requests, ~6 h; may need two runs).

on:
  workflow_dispatch:

jobs:
  scrape-remax-full:
    name: Re-check all RE/MAX listings
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: Production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run RE/MAX full refresh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scraper/run.py --source remax --refresh 20000 --time-budget 300
