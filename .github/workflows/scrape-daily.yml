name: Daily Scrape (New Listings)

# Link-out scraper (scraper/run.py): Rent-A-House from its sitemap at a 10 s
# crawl-delay, RE/MAX from its national search at 2 s. Fetches new listings
# plus a rolling batch of the oldest-checked ones, expires listings that left
# the source, takes the weekly price snapshot.
# SUPABASE_KEY must be the service-role key: run.py refuses any other key.
# The work server runs the same thing from cron (scraper/cron/run_daily.sh);
# don't run both, or every source is crawled twice a day.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (fetch and parse, write nothing)'
        required: false
        default: false
        type: boolean

jobs:
  scrape:
    name: Scrape all sources
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: Production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scraper/run.py --source all ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Send property alerts
        if: success() && !inputs.dry_run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SITE_URL: https://property.com.ve
        run: |
          echo "📬 Sending property alert emails..."
          python scraper/send_alerts.py
