name: Scrape Properties (Distributed)

on:
  # Run every Sunday at 3am UTC
  schedule:
    - cron: '0 3 * * 0'

  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      job_count:
        description: 'Number of parallel jobs (default: 9)'
        required: false
        default: '9'
        type: choice
        options:
          - '1'
          - '3'
          - '5'
          - '9'
          - '12'

jobs:
  detect:
    name: Detect Total Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      total_pages: ${{ steps.calculate.outputs.total }}
      page_ranges: ${{ steps.calculate.outputs.ranges }}
      job_count: ${{ steps.calculate.outputs.jobs }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install detection dependencies
        run: pip install playwright beautifulsoup4 lxml

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: Detect page count and calculate ranges
        id: calculate
        env:
          JOB_COUNT: ${{ inputs.job_count || '9' }}
        run: |
          echo "Detecting total page count and splitting into $JOB_COUNT jobs..."
          DETECTION_JSON=$(python scraper/detect_pages.py --jobs "$JOB_COUNT")
          echo "$DETECTION_JSON"

          TOTAL=$(printf '%s' "$DETECTION_JSON" | python -c "import json, sys; print(json.load(sys.stdin)['total_pages'])")
          RANGES=$(printf '%s' "$DETECTION_JSON" | python -c "import json, sys; print(json.dumps(json.load(sys.stdin)['ranges']))")
          JOBS=$(printf '%s' "$DETECTION_JSON" | python -c "import json, sys; print(json.load(sys.stdin)['jobs'])")

          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "ranges=$RANGES" >> $GITHUB_OUTPUT
          echo "jobs=$JOBS" >> $GITHUB_OUTPUT

          echo "Detected $TOTAL pages"
          echo "Split into $JOBS parallel jobs"

  scrape:
    name: ${{ matrix.page_range.name }} (Pages ${{ matrix.page_range.start }}-${{ matrix.page_range.end }})
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: Production

    strategy:
      max-parallel: 20
      fail-fast: false
      matrix:
        page_range: ${{ fromJson(needs.detect.outputs.page_ranges) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: Run scraper for pages ${{ matrix.page_range.start }}-${{ matrix.page_range.end }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scraper/run.py \
            --source rentahouse \
            --start-page ${{ matrix.page_range.start }} \
            --end-page ${{ matrix.page_range.end }} \
            --run-type full

      - name: Report completion
        if: always()
        run: |
          echo "=============================================="
          echo "Completed ${{ matrix.page_range.name }}"
          echo "  Pages: ${{ matrix.page_range.start }}-${{ matrix.page_range.end }}"
          echo "  Status: ${{ job.status }}"
          echo "  Time: $(date)"
          echo "=============================================="

  scrape-remax:
    name: Scrape RE/MAX Venezuela (Full)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: Production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: Run RE/MAX scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "🔄 Full RE/MAX scrape (~500 listings)"
          python scraper/run.py \
            --source remax \
            --run-type full

      - name: Report completion
        if: always()
        run: |
          echo "=============================================="
          echo "RE/MAX scrape completed"
          echo "  Status: ${{ job.status }}"
          echo "  Time: $(date)"
          echo "=============================================="

  summary:
    name: Scrape Summary
    needs: [detect, scrape, scrape-remax]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check scrape results
        run: |
          echo "=============================================="
          echo "DISTRIBUTED SCRAPE SUMMARY"
          echo "=============================================="
          echo "Total pages detected: ${{ needs.detect.outputs.total_pages }}"
          echo "Jobs: ${{ needs.detect.outputs.job_count }} parallel"
          echo "Rent-A-House status: ${{ needs.scrape.result }}"
          echo "RE/MAX status: ${{ needs.scrape-remax.result }}"
          echo "Alerts: daily incremental workflow only"
          echo ""
          echo "Next steps:"
          echo "- Check Supabase dashboard for listing count"
          echo "- Verify active listings count"
          echo "- Review any failed jobs above"
          echo "=============================================="
