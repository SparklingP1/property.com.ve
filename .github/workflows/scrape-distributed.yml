name: Scrape Properties (Weekly refresh)

# Weekly deeper refresh: re-checks more existing listings (prices change,
# 404s expire). A single job on purpose: Rent-A-House asks for a 10 s
# crawl-delay, so parallel jobs against it would break its robots.txt.
# (This replaced the 9-job distributed crawl of its ?page= search, which
# robots.txt disallows.)

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Existing listings to re-check per source'
        required: false
        default: '1000'
        type: string

jobs:
  refresh:
    name: Weekly refresh (all sources)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: Production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scraper/run.py --source all \
            --refresh ${{ inputs.refresh || '1000' }} \
            --time-budget 150
